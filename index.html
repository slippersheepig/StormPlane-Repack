<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>沙漠风暴 REPACK</title>
  <link rel="icon" href="./img/planeicon.png" />
  <link rel="apple-touch-icon" href="./img/ic_launcher.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0" aria-label="游戏画布"></canvas>
  </div>

  <div id="hud" aria-hidden="true">
    <div class="hud-item hud-score">
      <span class="hud-label">分数</span>
      <span id="score" class="hud-value">0</span>
    </div>
    <div class="hud-divider" aria-hidden="true"></div>
    <div class="hud-item hud-hp" id="hp-wrap">
      <span class="hud-label">装甲</span>
      <div class="hp-bar-track" aria-hidden="true">
        <div id="hp-bar" class="hp-bar-fill"></div>
      </div>
      <span id="lives" class="hud-value">100</span>
    </div>
    <div class="hud-divider" aria-hidden="true"></div>
    <div class="hud-item hud-weapon">
      <span id="weapon-badge" class="weapon-pill" data-tier="single">蓝刃</span>
    </div>
    <div class="hud-divider" aria-hidden="true"></div>
    <div class="hud-item hud-level">
      <span id="level" class="hud-value">普通 · 动态+0</span>
    </div>
  </div>

  <div id="hud-controls" aria-hidden="true">
    <button id="pause-btn" type="button" class="icon-btn" title="暂停 / 继续 (P)" aria-label="暂停或继续">
      <span class="icon-glyph" aria-hidden="true">⏸</span>
    </button>
    <button id="mute-btn" type="button" class="icon-btn" title="音效开关 (M)" aria-label="切换静音">
      <span class="icon-glyph" aria-hidden="true">🔊</span>
    </button>
  </div>

  <div id="pause-overlay" aria-hidden="true">
    <div class="pause-panel">
      <h2>已暂停</h2>
      <p class="pause-tip">按 P / Esc 键可快速恢复战斗</p>
      <div class="pause-actions">
        <button id="resume-btn" type="button" class="primary-btn">继续游戏</button>
        <button id="menu-btn" type="button" class="ghost-btn">返回首页</button>
      </div>
    </div>
  </div>

  <div id="loading" aria-hidden="false" role="status" aria-label="加载中">
    <div class="loader-card">
      <div class="loader-ring-wrap" role="presentation">
        <svg class="progress" viewBox="0 0 36 36" aria-hidden="true">
          <defs>
            <linearGradient id="loader-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00e5ff" />
              <stop offset="55%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <path class="bg" d="M18 2.0845a15.9155 15.9155 0 1 0 0 31.831a15.9155 15.9155 0 1 0 0-31.831" />
          <path class="meter" stroke-dasharray="0, 100" d="M18 2.0845a15.9155 15.9155 0 1 0 0 31.831a15.9155 15.9155 0 1 0 0-31.831" />
        </svg>
        <div class="progress-text">0%</div>
      </div>
      <div id="loading-status" class="loading-status">正在加载战机与音效资源...</div>
      <div id="loading-error" class="loading-error" hidden>
        <p id="loading-error-msg">引擎初始化失败，请检查网络后重试</p>
        <button id="retry-btn" type="button" class="retry-btn">重新加载</button>
      </div>
    </div>
  </div>

  <div id="menu">
    <div class="panel">
      <div class="panel-emblem" aria-hidden="true">
        <img src="./img/blue_plane.png" alt="" width="44" height="44" />
      </div>
      <h1>
        <span class="title-main">沙漠风暴</span>
        <span class="title-badge">REPACK</span>
      </h1>
      <div id="menu-record" class="menu-record" hidden>
        <span class="record-item">最高分 <strong id="best-score-val">0</strong></span>
        <span id="last-score-sep" class="record-sep" hidden>·</span>
        <span id="last-score-wrap" class="record-item" hidden>上局 <strong id="last-score-val">0</strong></span>
      </div>
      <div class="btns" id="diff-buttons" role="group" aria-label="选择难度">
        <button type="button" data-diff="easy">简单</button>
        <button type="button" data-diff="normal" class="active">普通</button>
        <button type="button" data-diff="hard">困难</button>
      </div>
      <p id="diff-desc" class="diff-desc">均衡敌机与弹幕密度，标准空战体验</p>
      <button id="start-btn" type="button" class="primary-btn">开始游戏</button>
      <p class="controls-hint">方向键 / WASD / 拖拽移动 · 自动连射 · P 暂停</p>
    </div>
  </div>

  <script>
    (function () {
      const DIFF_DESC = {
        easy: '敌机节奏较缓 · Boss 战无额外杂兵 · 适合轻松爽玩',
        normal: '均衡敌机与弹幕密度 · 标准街机空战体验',
        hard: '高频弹幕与强力首领 · 极限闪避挑战'
      };
      const diffBtns = document.querySelectorAll('#diff-buttons button');
      const diffDesc = document.getElementById('diff-desc');
      let selected = 'normal';
      window.__desiredDifficulty = selected;

      try {
        const savedBest = parseInt(localStorage.getItem('stormplane_best_score') || '0', 10);
        if (savedBest > 0) {
          const rec = document.getElementById('menu-record');
          const bestEl = document.getElementById('best-score-val');
          if (bestEl) bestEl.textContent = String(savedBest);
          if (rec) rec.hidden = false;
        }
      } catch (e) {}

      diffBtns.forEach((btn) => {
        btn.addEventListener('click', function () {
          diffBtns.forEach((b) => b.classList.remove('active'));
          this.classList.add('active');
          selected = this.dataset.diff || 'normal';
          window.__desiredDifficulty = selected;
          if (diffDesc && DIFF_DESC[selected]) {
            diffDesc.textContent = DIFF_DESC[selected];
          }
          if (typeof window.__onDiffChanged === 'function') {
            window.__onDiffChanged(selected);
          }
        }, { passive: true });
      });

      document.getElementById('start-btn').addEventListener('click', function () {
        if (!window.__pyReady) {
          window.__startClicked = true;
        }
      }, { passive: true });

      const retryBtn = document.getElementById('retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', function () {
          window.location.reload();
        });
      }
    })();
  </script>
  <script src="https://o.sheepgreen.top/pyodide/v314.0.8/full/pyodide.js"></script>
  <script>
    (async () => {
      const imgs = [
        './img/blue_plane.png',
        './img/red_plane.png',
        './img/purple_plane.png',
        './img/small_enemy.png',
        './img/middle_enemy.png',
        './img/big_enemy.png',
        './img/boss_enemy.png',
        './img/bossplane_crazy.png',
        './img/bossplane_bomb.png',
        './img/big_enemy_bullet.png',
        './img/boom.png',
        './img/myplaneexplosion.png',
        './img/bullet_goods1.png',
        './img/bullet_goods2.png',
        './img/plane_shield.png',
        './img/life_goods.png',
        './img/boss_bullet_default.png',
        './img/boss_bullet_triangle.png',
        './img/boss_bullet_thunderball_red.png',
        './img/boss_bullet_thunderball_green.png',
        './img/boss_bullet_hellfire_red.png',
        './img/boss_bullet_hellfire_yellow.png',
        './img/boss_bullet_sun_particle.png'
      ];
      const audios = [
        './sound/game.mp3',
        './sound/shoot.mp3',
        './sound/explosion.mp3',
        './sound/explosion2.wav',
        './sound/explosion3.wav',
        './sound/bigexplosion.wav',
        './sound/get_goods.wav',
        './sound/button.wav'
      ];

      window.PRELOADED_IMAGES = {};
      window.PRELOADED_AUDIO = {};

      const meter = document.querySelector('#loading .meter');
      const text = document.querySelector('#loading .progress-text');
      const statusEl = document.getElementById('loading-status');
      const totalAssets = imgs.length + audios.length;
      let loadedAssets = 0;

      function setProgress(pct, statusText) {
        const clamped = Math.max(0, Math.min(100, Math.round(pct)));
        if (meter) meter.setAttribute('stroke-dasharray', clamped + ', 100');
        if (text) text.textContent = clamped + '%';
        if (statusText && statusEl) statusEl.textContent = statusText;
      }

      function onAssetSettled() {
        loadedAssets += 1;
        setProgress((loadedAssets / totalAssets) * 75);
      }

      async function runPool(items, concurrency, worker) {
        let index = 0;
        const runners = Array.from({ length: Math.min(concurrency, items.length) }, async () => {
          while (index < items.length) {
            const current = items[index++];
            await worker(current);
          }
        });
        await Promise.all(runners);
      }

      function preloadImage(path) {
        return new Promise((resolve) => {
          const img = new Image();
          let settled = false;
          const finish = (ok) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            window.PRELOADED_IMAGES[path] = ok ? img : null;
            onAssetSettled();
            resolve(ok);
          };
          const timer = setTimeout(() => {
            console.warn('Image preload timeout:', path);
            finish(false);
          }, 4000);
          img.onload = () => finish(true);
          img.onerror = () => {
            console.warn('Image failed to load:', path);
            finish(false);
          };
          img.src = path;
        });
      }

      function preloadAudio(path) {
        return new Promise((resolve) => {
          let settled = false;
          let a = null;
          const finish = (audioObj) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            window.PRELOADED_AUDIO[path] = audioObj;
            onAssetSettled();
            resolve(Boolean(audioObj));
          };
          const timer = setTimeout(() => finish(a), 2000);
          try {
            a = new Audio();
            a.preload = 'auto';
            a.oncanplaythrough = () => finish(a);
            a.onloadeddata = () => finish(a);
            a.onerror = () => finish(null);
            a.src = path;
          } catch (e) {
            console.warn('Audio preload error:', e);
            finish(null);
          }
        });
      }

      await runPool(imgs, 6, preloadImage);
      await runPool(audios, 4, preloadAudio);

      try {
        setProgress(80, '正在启动 Python 运行时...');
        const pyodide = await loadPyodide();

        setProgress(92, '正在加载游戏核心模块...');
        const [utilsRes, mainRes] = await Promise.all([
          fetch('utils.py'),
          fetch('main.py')
        ]);
        if (!utilsRes.ok) throw new Error('无法加载 utils.py (HTTP ' + utilsRes.status + ')');
        if (!mainRes.ok) throw new Error('无法加载 main.py (HTTP ' + mainRes.status + ')');

        const [utilsCode, mainCode] = await Promise.all([
          utilsRes.text(),
          mainRes.text()
        ]);
        pyodide.FS.writeFile('utils.py', utilsCode);
        await pyodide.runPythonAsync(mainCode);

        window.__pyReady = true;
        setProgress(100, '准备就绪');

        const ld = document.getElementById('loading');
        if (ld) {
          ld.setAttribute('aria-hidden', 'true');
          ld.classList.add('fade-out');
          setTimeout(() => {
            ld.style.display = 'none';
          }, 320);
        }
      } catch (err) {
        console.error('Failed to load/run Python code:', err);
        const errBox = document.getElementById('loading-error');
        const errMsg = document.getElementById('loading-error-msg');
        if (statusEl) statusEl.textContent = '加载遇到问题';
        if (errMsg) errMsg.textContent = '初始化失败：' + (err && err.message ? err.message : String(err));
        if (errBox) errBox.hidden = false;
      }
    })();
  </script>
</body>
</html>
